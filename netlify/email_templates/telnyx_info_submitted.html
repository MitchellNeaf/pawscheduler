<!DOCTYPE html>
<html>
<head><meta charset="UTF-8" /></head>
<body style="font-family: -apple-system, sans-serif; color: #1f2937; padding: 24px;">
  <h2 style="color: #059669;">New Telnyx Info Submission</h2>
  <p><strong>{{groomer_name}}</strong> just submitted their business info for toll-free verification.</p>
  <table style="margin-top: 16px; font-size: 14px;">
    <tr><td style="padding: 4px 12px 4px 0; color: #6b7280;">Legal name</td><td>{{legal_name}}</td></tr>
    <tr><td style="padding: 4px 12px 4px 0; color: #6b7280;">Entity type</td><td>{{entity_type}}</td></tr>
    <tr><td style="padding: 4px 12px 4px 0; color: #6b7280;">EIN</td><td>{{ein}}</td></tr>
    <tr><td style="padding: 4px 12px 4px 0; color: #6b7280;">Address</td><td>{{address}}</td></tr>
    <tr><td style="padding: 4px 12px 4px 0; color: #6b7280;">Website</td><td>{{website}}</td></tr>
  </table>
  <p style="margin-top: 20px; font-size: 13px; color: #6b7280;">Ready to submit to Telnyx for this groomer.</p>
</body>
</html>
